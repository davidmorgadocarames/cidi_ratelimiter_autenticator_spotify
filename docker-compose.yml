# Servicios adelantados fase a fase (ver docs/architecture.md):
#   - postgres                -> Fase 1 (adelantado)
#   - redis                   -> Fase 6 (standalone, para el rate limiter)
#   - app                     -> Fase 7 (la API dockerizada; stack completo)
#   - minio                   -> Fase 8 (almacenamiento de audio, compatible S3)
#   - meilisearch              -> Fase 10
# (Sin clave `version:` - está deprecada en Compose v2.)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spotify_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d spotify_clone"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Resuelto desde el .env de la raiz (Docker Compose lo lee automaticamente
      # para interpolar ${VAR} dentro del propio YAML - mecanismo distinto y
      # adicional a env_file, que pasa variables DENTRO del contenedor). Si .env
      # no tuviera estas claves, Compose sustituiria una cadena vacia con un
      # warning en stderr en vez de fallar - no deberia darse en la practica
      # porque S3_ACCESS_KEY/S3_SECRET_KEY ya son necesarias para que la propia
      # app arranque (validador anti-"change-me" en config.py).
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # consola web
    volumes:
      - minio_data:/data
    healthcheck:
      # Verificado empiricamente: la imagen oficial minio/minio SI trae curl
      # (a diferencia de lo que exigiria un healthcheck via GitHub Actions
      # "services:", que no soporta pasar el "command: server /data" que este
      # servicio necesita - ver el job "test" de ci.yml, que arranca MinIO con
      # un "docker run -d" manual en vez de "services:").
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      # Nombres de servicio de compose (red interna), no localhost: el resto de
      # secretos (JWT_SECRET_KEY, TOTP_ENCRYPTION_KEY, ...) vienen del .env real
      # del desarrollador via env_file de abajo - "environment" pisa a "env_file"
      # para estas claves concretas sin tener que duplicarlas a mano aqui.
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/spotify_clone
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      # Default real es True (config.py) - sobre HTTP local sin este override el
      # navegador/curl no reenvía la cookie Secure del refresh token.
      COOKIE_SECURE: "false"
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"

volumes:
  postgres_data:
  minio_data:
