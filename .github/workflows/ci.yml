name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: spotify_clone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d spotify_clone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        # A diferencia de MinIO (más abajo, "Start MinIO"), la imagen oficial
        # arranca sin argumentos de comando obligatorios (la master key va por
        # variable de entorno) - sí puede usar el bloque declarativo
        # "services:", igual que postgres/redis. Verificado empíricamente que
        # la imagen trae curl (Alpine-based, ver docker-compose.yml).
        image: getmeili/meilisearch:v1.53.1
        env:
          MEILI_MASTER_KEY: ci-meilisearch-master-key-not-a-real-secret
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -f http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/spotify_clone
      TEST_DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/spotify_clone_test
      # Secrets de solo-CI: valores válidos pero sin ningún dato real detrás. Nunca
      # hardcodeados en este YAML (ver docs/architecture.md) - configurar en
      # Settings > Secrets and variables > Actions antes del primer run.
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      TOTP_ENCRYPTION_KEY: ${{ secrets.CI_TOTP_ENCRYPTION_KEY }}
      COOKIE_SECURE: "false"
      REDIS_URL: redis://localhost:6379/0
      # Credenciales de MinIO solo-CI (igual que las de Postgres arriba, no son
      # secretas - MinIO no tiene equivalente a GitHub Secrets para esto).
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET_NAME: songs
      # Mismo valor que MEILI_MASTER_KEY del servicio "meilisearch" de arriba -
      # no es un secreto real (igual que las credenciales de MinIO), solo-CI.
      MEILISEARCH_URL: http://localhost:7700
      MEILISEARCH_API_KEY: ci-meilisearch-master-key-not-a-real-secret
      # Mismo Redis que el servicio "redis" de arriba, DB 1 (namespace lógico
      # distinto, no necesita nada adicional en "services:"). El worker/beat
      # reales no se levantan en este job - la suite llama a la lógica de
      # negocio directamente contra Postgres/Redis reales, sin pasar por un
      # broker real (ver tests/test_recommendations.py).
      CELERY_BROKER_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start MinIO
        # GitHub Actions "services:" no soporta pasar argumentos de comando
        # (server /data) a la imagen minio/minio - mismo motivo que en el job
        # "docker" de abajo para la imagen de la propia app: un "docker run -d"
        # manual con loop de espera, en vez de "services:".
        run: |
          docker run -d --name minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=$S3_ACCESS_KEY \
            -e MINIO_ROOT_PASSWORD=$S3_SECRET_KEY \
            minio/minio:latest server /data

          for i in $(seq 1 15); do
            if curl -sf http://localhost:9000/minio/health/live; then
              break
            fi
            sleep 2
          done

      - name: Create test database
        # spotify_clone (POSTGRES_DB del servicio) ya existe al arrancar el
        # contenedor; spotify_clone_test no. CREATE DATABASE no puede ejecutarse
        # dentro de una transacción, de ahí autocommit=True explícito.
        run: |
          python -c "
          import psycopg
          conn = psycopg.connect('postgresql://user:password@localhost:5432/spotify_clone', autocommit=True)
          conn.execute('CREATE DATABASE spotify_clone_test')
          conn.close()
          "

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy --strict)
        run: mypy app tests

      - name: Tests + coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio-ci || true

  docker:
    runs-on: ubuntu-latest
    # No construye la imagen si los tests ya fallaron - ahorra minutos de CI.
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: spotify_clone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d spotify_clone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/spotify_clone
      REDIS_URL: redis://localhost:6379/0
      COOKIE_SECURE: "false"
      # Este job no levanta Meilisearch real, pero necesita valores que pasen
      # el validador anti-"change-me" de Settings - la importación de
      # app.core.config ocurre en el ENTRYPOINT (alembic upgrade head) antes
      # de que uvicorn arranque, aunque el smoke test de abajo nunca toque
      # /songs/search (mismo motivo que S3_* justo debajo).
      MEILISEARCH_URL: http://localhost:7700
      MEILISEARCH_API_KEY: ci-meilisearch-master-key-not-a-real-secret
      # Mismo Redis del servicio "redis" de este job, DB 1 - usado por el paso
      # "Run celery-worker" de abajo, la única verificación end-to-end real
      # (broker -> worker -> Redis) de toda la fase.
      CELERY_BROKER_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      TOTP_ENCRYPTION_KEY: ${{ secrets.CI_TOTP_ENCRYPTION_KEY }}
      # Este job no levanta MinIO (solo hace smoke-test de /health, no de
      # /songs) - pero Settings rechaza el placeholder "change-me" para
      # S3_ACCESS_KEY/S3_SECRET_KEY al importar app.core.config, y esa
      # importación ocurre igualmente en el ENTRYPOINT (alembic upgrade head)
      # aunque el endpoint que se prueba no toque S3 en absoluto. La app
      # arranca igual sin MinIO real disponible (fail-open en el lifespan,
      # ver app/main.py) - solo hacen falta valores que pasen la validación.
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET_NAME: songs

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cidi-api:ci .

      - name: Run container and smoke-test /health
        # Pass-through de -e (sin "=valor" inline): el contenedor hereda el valor
        # del env: del job, así los secrets nunca aparecen en la línea de comando
        # ni en "docker inspect"/logs. --network host: el runner ubuntu-latest
        # permite que la imagen recién construida hable con los servicios de CI
        # (postgres/redis) vía localhost, igual que ya hace el job "test".
        run: |
          docker run -d --name cidi-api-ci \
            --network host \
            -e DATABASE_URL \
            -e REDIS_URL \
            -e COOKIE_SECURE \
            -e JWT_SECRET_KEY \
            -e TOTP_ENCRYPTION_KEY \
            -e S3_ENDPOINT_URL \
            -e S3_ACCESS_KEY \
            -e S3_SECRET_KEY \
            -e S3_BUCKET_NAME \
            -e MEILISEARCH_URL \
            -e MEILISEARCH_API_KEY \
            cidi-api:ci

          ok=""
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ -z "$ok" ]; then
            echo "El contenedor no respondió sano a tiempo. Logs:"
            docker logs cidi-api-ci
            exit 1
          fi

      - name: Smoke-test Redis real (no solo Postgres/liveness)
        # /health no toca Redis (ni DB en runtime, solo demuestra que uvicorn vive
        # - la conexión a Postgres ya la prueba el ENTRYPOINT al migrar antes de
        # arrancar). Sin este paso, un REDIS_URL roto pasaría el smoke test igual
        # (el rate limiter es fail-open: ver app/core/rate_limiter.py). La cabecera
        # X-RateLimit-Limit solo se añade en el camino feliz (Redis respondió con
        # éxito) - su ausencia en un 201 indicaría fail-open silencioso.
        run: |
          headers=$(curl -sf -D - -o /dev/null -X POST http://localhost:8000/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-smoke@example.com","password":"supersecret123"}')

          if ! echo "$headers" | grep -qi "^X-RateLimit-Limit:"; then
            echo "Falta X-RateLimit-Limit: el rate limiter no llegó a hablar con Redis (fail-open silencioso). Logs:"
            docker logs cidi-api-ci
            exit 1
          fi

      - name: Stop container
        if: always()
        run: docker rm -f cidi-api-ci || true

      - name: Run celery-worker and verify real broker connectivity
        # El usuario "ci-smoke@example.com" ya existe en Postgres desde el
        # paso "Smoke-test Redis real" de arriba (el servicio "postgres" del
        # job sigue vivo aunque cidi-api-ci ya se haya parado) - la tarea
        # recorre todos los usuarios, así que sin al menos uno no se
        # escribiría ninguna clave "recommendations:*" y este paso daría
        # falso negativo por falta de datos, no por un fallo real.
        # Mismo patrón manual "docker run" que "app" arriba, reusando la misma
        # imagen con entrypoint/command de Celery (igual que docker-compose.yml).
        # Corregido en la revisión del plan: comprobar solo que el proceso
        # siga "Running" da falso positivo - un worker que no puede alcanzar
        # el broker reintenta con backoff y sigue "vivo" igual, logueando el
        # error en vez de salir. En su lugar: (1) grep en los logs de la línea
        # de arranque exitoso ("... ready.") confirma que conectó al broker de
        # verdad; (2) dispara la tarea real contra el broker real y hace
        # polling sobre Redis hasta ver aparecer una clave "recommendations:*"
        # - la única cobertura automatizada de infraestructura real para la
        # ruta completa CLI -> broker -> worker -> Redis (el job "test" de
        # arriba llama la lógica de negocio directo, sin broker real).
        run: |
          docker run -d --name celery-worker-ci \
            --network host \
            --entrypoint celery \
            -e DATABASE_URL \
            -e REDIS_URL \
            -e CELERY_BROKER_URL \
            -e JWT_SECRET_KEY \
            -e TOTP_ENCRYPTION_KEY \
            -e S3_ENDPOINT_URL \
            -e S3_ACCESS_KEY \
            -e S3_SECRET_KEY \
            -e S3_BUCKET_NAME \
            -e MEILISEARCH_URL \
            -e MEILISEARCH_API_KEY \
            cidi-api:ci \
            -A app.worker worker --loglevel=info

          ready=""
          for i in $(seq 1 15); do
            if docker logs celery-worker-ci 2>&1 | grep -q "ready\."; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ -z "$ready" ]; then
            echo "El worker de Celery no conectó al broker a tiempo. Logs:"
            docker logs celery-worker-ci
            exit 1
          fi

          docker exec celery-worker-ci celery -A app.worker call app.worker.recompute_all_recommendations

          found=""
          for i in $(seq 1 15); do
            keys=$(docker run --rm --network host redis:7-alpine redis-cli -n 0 keys "recommendations:*")
            if [ -n "$keys" ]; then
              found=1
              break
            fi
            sleep 2
          done

          if [ -z "$found" ]; then
            echo "No apareció ninguna clave recommendations:* en Redis tras disparar la tarea. Logs del worker:"
            docker logs celery-worker-ci
            exit 1
          fi

      - name: Stop celery-worker
        if: always()
        run: docker rm -f celery-worker-ci || true
